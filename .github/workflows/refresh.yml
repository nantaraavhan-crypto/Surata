name: Refresh site data

# Keeps https://surata.vercel.app fresh without anything running on a
# desktop. Every request below lands on an endpoint whose snapshot may have
# aged past its five-minute window, which forces a real re-scrape server-side.
#
# Five minutes is deliberate, not arbitrary: the app's shared snapshot expires
# every 300 seconds, so hitting it *more* often would not refresh it faster —
# it would just burn CI minutes re-reading an entry that is still fresh.
#
# NOTE: this file must live at the repository root, because the app itself
# sits in the `surata-app/` subdirectory. GitHub only discovers workflows at
# `<repo-root>/.github/workflows/`.

on:
  schedule:
    - cron: "*/5 * * * *"
  # Lets the workflow be run by hand from the Actions tab.
  workflow_dispatch:
  # Refresh immediately after each deploy rather than waiting for the next
  # scheduled tick, and give the scheduler something to prove itself with on
  # the very first push.
  push:
    branches: [main]
    paths:
      - "surata-app/**"
      # Without this the workflow's own edits would never match, so a change
      # to this file could not be used to test that Actions runs at all.
      - ".github/workflows/refresh.yml"

# One refresh at a time; a slow run should not be stacked behind a fast one.
concurrency:
  group: refresh-site-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The slowest endpoint has been observed near 35s; this leaves generous
    # headroom before GitHub kills it and reports a false failure.
    timeout-minutes: 10
    defaults:
      run:
        # The Next.js app and its scripts live one directory down.
        working-directory: surata-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh and verify every section
        run: node scripts/refresh.mjs
        env:
          SITE_URL: https://surata.vercel.app
